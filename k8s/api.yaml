apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: cardimed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: api-server
          image: ${CI_REGISTRY_IMAGE}/cardimedbackend:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: postgres://telemetryhub:$(POSTGRES_PASSWORD)@postgres:5432/telemetryhub?sslmode=disable

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: JWT_SECRET

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: ADMIN_PASSWORD

            - name: ADMIN_EMAIL
              value: "admin@cardimed.local"

            - name: FRONTEND_URL
              value: "http://cardimed.192.168.1.50.nip.io"

            - name: API_HOST
              value: "0.0.0.0"

            - name: API_PORT
              value: "8080"

            - name: MQTT_BROKERS
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: MQTT_BROKERS

            - name: LOG_LEVEL
              value: "info"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: cardimed
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
