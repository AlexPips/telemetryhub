apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: cardimed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: api-server
          image: ${CI_REGISTRY_IMAGE}/cardimedbackend:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: postgres://telemetryhub:$(POSTGRES_PASSWORD)@postgres:5432/telemetryhub?sslmode=disable

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: JWT_SECRET

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardimed-secrets
                  key: ADMIN_PASSWORD

            - name: API_HOST
              value: "0.0.0.0"

            - name: API_PORT
              value: "8080"

            - name: MQTT_BROKER
              value: mosquitto

            - name: MQTT_PORT
              value: "1883"

            - name: MQTT_TOPIC
              value: "CARDIMED/#"

            - name: MQTT_QOS
              value: "1"

            - name: MQTT_TLS
              value: "false"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: cardimed
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080