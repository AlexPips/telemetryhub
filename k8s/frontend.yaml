apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cardimed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: frontend
          image: ${CI_REGISTRY_IMAGE}/cardimedfrontend:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NEXT_PUBLIC_API_URL
              value: /api/v1

          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 3000
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          #   failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cardimed
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000