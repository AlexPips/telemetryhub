apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardimed
  namespace: cardimed
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - cardimed.192.168.1.50.nip.io
        - api.cardimed.192.168.1.50.nip.io
      secretName: cardimed-tls
  rules:
    - host: cardimed.192.168.1.50.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

    - host: api.cardimed.192.168.1.50.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 8080