apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardimed
  namespace: cardimed
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: cardimed.ebosrndportal.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
