stages:
  - build
  - deploy

build:
  stage: build
  # Temp disable flag
  rules:
   - when: never 
  image: docker:24

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]

  script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    - docker build -f docker/frontend.Dockerfile -t $CI_REGISTRY_IMAGE/cardimedfrontend:$CI_COMMIT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/cardimedfrontend:$CI_COMMIT_SHA

    - docker build -f docker/api.Dockerfile -t $CI_REGISTRY_IMAGE/cardimedbackend:$CI_COMMIT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/cardimedbackend:$CI_COMMIT_SHA

  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]

  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
    K8S_NAMESPACE: cardimed

  script:
      - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/ebos-root-ca.crt
      - update-ca-certificates
      - kubectl config use-context rd-devs/k8s-connecttion:rnddevs-k8s-connection
      - kubectl apply --validate=false -f k8s/namespace.yaml

      # Registry pull secret
      - kubectl delete secret gitlab-registry -n $K8S_NAMESPACE --ignore-not-found
      - |
        kubectl create secret docker-registry gitlab-registry \
          --docker-server="$CI_REGISTRY" \
          --docker-username="$CI_REGISTRY_USER" \
          --docker-password="$CI_REGISTRY_PASSWORD" \
          --docker-email="${GITLAB_USER_EMAIL:-$CI_COMMIT_AUTHOR_EMAIL}" \
          -n $K8S_NAMESPACE

      - kubectl apply --validate=false -f k8s/secrets.yaml
      - kubectl apply --validate=false -f k8s/postgres.yaml
      # - kubectl apply --validate=false -f k8s/mosquitto.yaml

      # - export IMAGE_TAG=$CI_COMMIT_SHA
      # - envsubst < k8s/api.yaml      > /tmp/api.yaml
      # - envsubst < k8s/frontend.yaml > /tmp/frontend.yaml

      # - kubectl apply --validate=false -f /tmp/api.yaml
      # - kubectl apply --validate=false -f /tmp/frontend.yaml
      # - kubectl apply --validate=false -f k8s/ingress.yaml

      # - kubectl rollout status deployment/api-server -n $K8S_NAMESPACE --timeout=300s
      # - kubectl rollout status deployment/frontend   -n $K8S_NAMESPACE --timeout=300s

  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'