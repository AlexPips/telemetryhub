include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - deploy

variables:
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/cardimedfrontend:$CI_COMMIT_SHA"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/cardimedbackend:$CI_COMMIT_SHA"

build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg NEXT_PUBLIC_API_URL=https://cardimed.192.168.1.50.nip.io/api/v1 -f docker/frontend.Dockerfile -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"
    - docker build -f docker/api.Dockerfile -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"

.container_scanning_base:
  allow_failure: false
  variables:
    CS_SEVERITY_THRESHOLD: "high"
    SECURE_LOG_LEVEL: 'debug'
  script:
    - gtcs scan
    - |
      HIGH_COUNT=$(grep -o '"severity":"High"' gl-container-scanning-report.json | wc -l || true)
      CRITICAL_COUNT=$(grep -o '"severity":"Critical"' gl-container-scanning-report.json | wc -l || true)
      echo "========================================"
      echo "Container Security Scan - $CS_IMAGE"
      echo "========================================"
      echo "High vulnerabilities:     $HIGH_COUNT"
      echo "Critical vulnerabilities: $CRITICAL_COUNT"
      echo "========================================"
      if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
        echo "ERROR: High or Critical vulnerabilities found."
        echo "Pipeline will be stopped."
        exit 1
      else
        echo "No High or Critical vulnerabilities found."
        echo "Container is approved for deployment."
      fi

container_scanning_frontend:
  extends: .container_scanning_base
  stage: test
  needs: ["build"]
  before_script:
    - export CS_IMAGE="$FRONTEND_IMAGE"

container_scanning_backend:
  extends: .container_scanning_base
  stage: test
  needs: ["build"]
  before_script:
    - export CS_IMAGE="$BACKEND_IMAGE"

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
    K8S_NAMESPACE: cardimed
  needs:
    - container_scanning_frontend
    - container_scanning_backend
  script:
    - kubectl config use-context rd-devs/k8s-connecttion:rnddevs-k8s-connection
    - kubectl apply --validate=false --insecure-skip-tls-verify -f k8s/namespace.yaml
    - kubectl delete secret gitlab-registry -n $K8S_NAMESPACE --ignore-not-found --insecure-skip-tls-verify
    - |
      kubectl create secret docker-registry gitlab-registry \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$CI_REGISTRY_USER" \
        --docker-password="$CI_REGISTRY_PASSWORD" \
        --docker-email="${GITLAB_USER_EMAIL:-$CI_COMMIT_AUTHOR_EMAIL}" \
        -n $K8S_NAMESPACE --insecure-skip-tls-verify
    - kubectl apply --validate=false --insecure-skip-tls-verify -f k8s/secrets.yaml
    - kubectl apply --validate=false --insecure-skip-tls-verify -f k8s/postgres.yaml
    - export IMAGE_TAG=$CI_COMMIT_SHA
    - envsubst < k8s/api.yaml      > /tmp/api.yaml
    - envsubst < k8s/frontend.yaml > /tmp/frontend.yaml
    - kubectl apply --validate=false --insecure-skip-tls-verify -f /tmp/api.yaml
    - kubectl apply --validate=false --insecure-skip-tls-verify -f /tmp/frontend.yaml
    - kubectl apply --validate=false --insecure-skip-tls-verify -f k8s/ingress.yaml
    - kubectl rollout restart deployment/api-server --insecure-skip-tls-verify -n $K8S_NAMESPACE
    - kubectl rollout restart deployment/frontend --insecure-skip-tls-verify -n $K8S_NAMESPACE
    - kubectl rollout status deployment/api-server --insecure-skip-tls-verify -n $K8S_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/frontend   --insecure-skip-tls-verify -n $K8S_NAMESPACE --timeout=300s