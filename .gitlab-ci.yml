stages:
  - build
  - deploy

build:
  stage: build
  image: 
    name: docker
    entrypoint: ['']
  services:
    - docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build  -f docker/frontend.Dockerfile -t $CI_REGISTRY_IMAGE/cardimedfrontend:$CI_COMMIT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/cardimedfrontend:$CI_COMMIT_SHA
    - docker build  -f docker/api.Dockerfile -t $CI_REGISTRY_IMAGE/cardimedbackend:$CI_COMMIT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/cardimedbackend:$CI_COMMIT_SHA
    - docker build  -f docker/simulator.Dockerfile -t $CI_REGISTRY_IMAGE/cardimedsimulator:$CI_COMMIT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/cardimedsimulator:$CI_COMMIT_SHA

  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "prod"'

